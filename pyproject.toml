[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "red-flag-detector"
version = "0.1.0"
description = "Scores dating-app messages for toxic language and gaslighting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "joblib",
    "gradio",
    "huggingface_hub",
]

[project.optional-dependencies]
deep = ["torch", "transformers"]
dev = ["pytest", "jupyter", "ipykernel", "nbconvert", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
